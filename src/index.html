<!doctype html>
<html lang="es" data-theme="cielo">
<head>
  <meta charset="utf-8">
  <title>Próxima</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Próxima — identidad, launcher y cuenta de la suite.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async></script>

  <!--
    Arranque: la marca antes que el framework.

    El Hub no pintaba NADA hasta que terminaban dos llamadas encadenadas
    —`config.json` y `POST /auth/refresh`—: medido contra app.proxima.test, el
    primer contenido llegaba a los 806 ms con caché caliente y a los 2722 ms en
    frío. Con `<app-root>` vacío, todo ese rato era una pantalla en blanco, y de
    ahí la sensación de que la app «entra desordenada».

    Esto no acelera nada: la sesión hay que resolverla igual antes de saber a
    qué pantalla vas. Lo que cambia es lo que ves mientras tanto. Va inline y sin
    dependencias a propósito — se pinta con el primer byte de HTML, sin esperar
    ni al CSS de la app ni a las fuentes.

    Vive FUERA de `<app-root>` a propósito. Dentro, Angular lo borraba al
    arrancar — que es antes de que el primer guard resuelva y la ruta tenga algo
    que enseñar, así que quedaba un segundo hueco en blanco en medio. Lo quita
    `App` cuando termina la primera navegación, que es cuando ya hay pantalla.
  -->
  <style>
    .px-boot {
      position: fixed;
      transition: opacity 220ms ease;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      /* El mismo lienzo que --px-canvas, escrito acá porque el CSS de la app
         todavía no llegó. */
      background: #fbfbfc;
    }

    .px-boot-mark {
      width: 22px;
      height: 34px;
      background: oklch(0.365 0.268 265);
      clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
    }

    .px-boot-track {
      width: 132px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: #eceef2;
    }

    .px-boot-fill {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: oklch(0.365 0.268 265);
      animation: px-boot-slide 1.1s ease-in-out infinite;
    }

    @keyframes px-boot-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }

    .px-boot.px-boot-out { opacity: 0; pointer-events: none; }

    /* Quieta, pero presente: sin movimiento la señal sigue siendo «esto carga». */
    @media (prefers-reduced-motion: reduce) {
      .px-boot-fill { animation: none; width: 100%; opacity: 0.8; }
      .px-boot { transition: none; }
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <div id="px-boot" class="px-boot" role="status" aria-label="Cargando Próxima">
    <span class="px-boot-mark" aria-hidden="true"></span>
    <span class="px-boot-track" aria-hidden="true"><span class="px-boot-fill"></span></span>
  </div>
</body>
</html>
