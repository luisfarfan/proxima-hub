<div class="guest-root" [class.guest-plain]="!split()">

  @if (split()) {
    <!--
      La fachada: el amarillo es superficie, no acento. En escritorio es la
      pared de la izquierda; en teléfono se convierte en la franja de arriba,
      así que la marca no desaparece como pasaba antes.
    -->
    <aside class="fachada" aria-hidden="true">
      <div class="fachada-inner">
        <proxima-logo size="lg" class="fachada-marca" />

        <div class="fachada-mid">
          <p class="fachada-rotulo">Tu negocio,<br>ordenado.</p>
          <p class="fachada-sub">Catálogo, ventas, inventario y facturación en un solo sitio.</p>
        </div>

        <ul class="fachada-lista" role="list">
          @for (feat of features; track feat) {
            <li class="fachada-item">
              <span class="fachada-tick">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
              <span>{{ feat }}</span>
            </li>
          }
        </ul>
      </div>
    </aside>
  }

  <main
    id="main-content"
    class="guest-main"
    [class.guest-main-split]="split()"
  >
    <div
      class="guest-panel"
      [class.guest-card]="!split()"
      [attr.data-testid]="testId()"
    >
      @if (!split()) {
        <div class="guest-plain-marca">
          <proxima-logo size="md" />
        </div>
      }

      <header class="guest-head" [class.guest-head-center]="!split()">
        <h1 class="guest-title">{{ title() }}</h1>
        @if (subtitle(); as sub) {
          <p class="guest-sub">{{ sub }}</p>
        }
      </header>

      <ng-content />
    </div>

    @if (split()) {
      <p class="guest-foot">© {{ year }} Próxima · proxima.pe</p>
    }
  </main>

</div>
