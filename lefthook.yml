# PROXIMA Engineering System (D6): hooks rápidos staged; el gate completo es CI.
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: sh -c 'command -v gitleaks >/dev/null || { echo "gitleaks no instalado - saltado"; exit 0; }; gitleaks protect --staged --no-banner --redact'
    - name: beads-export
      run: sh -c 'test -d .beads && env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE timeout 15 bd export > .beads/issues.jsonl 2>/dev/null && git add .beads/issues.jsonl || true'

commit-msg:
  jobs:
    - name: conventional-commits
      run: ../proxima-engineering/scripts/check-commit-msg.sh {1}

# BEGIN PROXIMA GUARDRAILS (D15) — lo mantiene scripts/install-guardrails.sh
# Los repos son privados en GitHub Free: la branch protection del servidor NO
# está disponible. Este hook es la única barrera real contra el push a main.
# Bypass consciente:  PROXIMA_ALLOW_MAIN_PUSH=1 git push origin main
pre-push:
  jobs:
    - name: no-push-to-main
      use_stdin: true
      run: ../proxima-engineering/scripts/check-push-branch.sh
# END PROXIMA GUARDRAILS
