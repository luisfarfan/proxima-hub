# PROXIMA Engineering System (D8): CI solo llama 'mise run ci'.
# NOTA: hub es PÚBLICO y no puede consumir el reusable privado de proxima-engineering
# → pasos inline (mismo contrato). Si se privatiza, migrar al reusable (ver pos).
name: ci
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.7
      - name: mise run ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: mise run ci
