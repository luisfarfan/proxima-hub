<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; letter-spacing: -0.003em; }
    a { color: #0009dc; text-decoration: none; } a:hover { color: #000678; text-decoration: underline; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

    .marca { display: inline-flex; align-items: center; gap: 0.5rem; }
    .marca-fig { background: oklch(0.365 0.268 265); clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); flex-shrink: 0; }
    .marca-txt { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-variation-settings: 'wdth' 86; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }

    .campo { display: flex; flex-direction: column; gap: 7px; }
    .lbl { font-size: 0.8125rem; font-weight: 500; color: oklch(0.205 0.016 74); }
    .inp {
      width: 100%; box-sizing: border-box; height: 46px; padding: 0 14px;
      border: 1px solid rgba(27,26,23,0.16); border-radius: 8px; background: #fff;
      font-family: inherit; font-size: 0.9375rem; color: oklch(0.205 0.016 74); outline: none;
      transition: border-color .14s ease, box-shadow .14s ease;
    }
    .inp::placeholder { color: oklch(0.515 0.016 78); }
    .inp:focus { border-color: oklch(0.365 0.268 265); box-shadow: 0 0 0 3px rgba(0,9,220,0.13); }

    .cta {
      width: 100%; height: 48px; border-radius: 8px;
      background: oklch(0.365 0.268 265); color: #fff;
      font-size: 0.9375rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: background .16s ease, transform .12s ease;
    }
    .cta:hover { background: oklch(0.445 0.262 265); }
    .cta:active { transform: scale(0.99); }

    /* Una franja de pared arriba: la marca se apoya en ella y el resto respira. */
    .franja { height: 6px; background: oklch(0.868 0.163 89); }

    .in { opacity: 0; animation: up 620ms cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .in { animation-duration: 1ms; opacity: 1; transform: none; } }
  </style>
</helmet>

<div style="width: 1180px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: oklch(0.973 0.012 88); overflow: hidden;">

  <div class="franja"></div>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;">

    <div class="in" style="width: 100%; max-width: 23rem;">

      <span class="marca" style="margin-bottom: 40px;">
        <span class="marca-fig" style="width: 22px; height: 34px;"></span>
        <span class="marca-txt" style="font-size: 1.75rem; color: oklch(0.205 0.016 74);">PROXIMA</span>
      </span>

      <h1 style="margin: 0 0 8px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-variation-settings: 'wdth' 86; font-weight: 800; font-size: 1.875rem; letter-spacing: -0.02em; color: oklch(0.205 0.016 74);">Entra a tu negocio</h1>
      <p style="margin: 0 0 30px; font-size: 0.9375rem; color: oklch(0.452 0.017 76);">Una sola cuenta para el panel, la caja y tu tienda.</p>

      <div style="display: flex; flex-direction: column; gap: 18px;">
        <label class="campo">
          <span class="lbl">Correo electrónico</span>
          <input class="inp" type="email" placeholder="tu@correo.com" autocomplete="email" />
        </label>

        <label class="campo">
          <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
            <span class="lbl">Contraseña</span>
            <a href="#" style="font-size: 0.75rem; font-weight: 500;">¿La olvidaste?</a>
          </span>
          <input class="inp" type="password" placeholder="Tu contraseña" autocomplete="current-password" />
        </label>
      </div>

      <div style="margin-top: 26px;">
        <button type="button" class="cta">
          Entrar
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>

      <p style="margin: 24px 0 0; text-align: center; font-size: 0.875rem; color: oklch(0.452 0.017 76);">¿Todavía no tienes cuenta? <a href="#" style="font-weight: 600;">Crea tu negocio gratis</a></p>

    </div>

  </main>

  <footer style="display: flex; align-items: center; justify-content: center; gap: 20px; padding: 22px 40px; border-top: 1px solid rgba(27,26,23,0.09); font-size: 0.75rem; color: oklch(0.515 0.016 78);">
    <span>Próxima · Lima, Perú</span>
    <span style="width: 3px; height: 3px; border-radius: 50%; background: rgba(27,26,23,0.2);"></span>
    <a href="#" style="color: oklch(0.452 0.017 76);">Términos</a>
    <a href="#" style="color: oklch(0.452 0.017 76);">Privacidad</a>
    <a href="#" style="color: oklch(0.452 0.017 76);">Ayuda</a>
  </footer>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1180,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
