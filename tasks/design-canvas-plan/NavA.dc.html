  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; letter-spacing: -0.003em; }
    a { color: #0009dc; text-decoration: none; } a:hover { color: #000678; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; text-align: left; }

    .grp { display: block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8a887f; margin-bottom: 9px; }
    .who { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }

    .who-n { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who-s { display: block; font-size: 0.6875rem; color: #8a887f; margin-top: 1px; }

    .nl { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 9px; font-size: 0.875rem; color: #4a4841; transition: background .14s ease, color .14s ease; }
    .nl:hover { background: rgba(27,26,23,0.05); color: #1b1a17; }
    .nl.on { background: #f3f4ff; color: #0009dc; font-weight: 600; }
    .nl svg { flex-shrink: 0; opacity: .75; }
    .nl.on svg { opacity: 1; }
    .nl-b { margin-left: auto; font-size: 0.6875rem; font-weight: 600; color: #8a887f; background: rgba(27,26,23,0.06); padding: 2px 7px; border-radius: 999px; }
  </style>

          <span style="min-width: 0;">
            <span class="who-n">Luis Farfán</span>
            <span class="who-s">lucho.farfan9@gmail.com</span>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <button type="button" class="nl">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
            Perfil
          </button>
          <button type="button" class="nl">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>

      <p style="margin: 0 0 24px; font-size: 0.875rem; color: #6c6a63;">LuchoEcommerce · se cobra el 24 de cada mes</p>
      <div style="height: 150px; border: 1px solid rgba(27,26,23,0.11); border-radius: 16px; background: #fff;"></div>
      <div style="display: flex; gap: 12px; margin-top: 14px;">
        <div style="flex: 1; height: 210px; border: 1px solid rgba(27,26,23,0.11); border-radius: 16px; background: #fff;"></div>
        <div style="flex: 1; height: 210px; border: 1px solid rgba(27,26,23,0.11); border-radius: 16px; background: #fff;"></div>
        <div style="flex: 1; height: 210px; border: 1px solid rgba(27,26,23,0.11); border-radius: 16px; background: #fff;"></div>
      </div>
    </main>

  </div>

</div>
